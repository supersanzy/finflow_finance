              config:
                severity: error

          - unique:
              description: Ensures every card is unique.
              config:
                severity: error

      - name: customer_id
        data_tests:
          - not_null:
              description: Ensures that only customer(s) that has cards are recorded.
              config:
                severity: error

          - relationships:
              arguments:
                to: ref('silver_customers')
                field: customer_id

      - name: account_id
        data_tests:
          - not_null:
              description: >
                Valdates that a card associated an account id can't be null
              config:
                severity: error

          - unique:
              description: Ensures that a card uniquely belongs to one account.
              config:
                severity: error

          - relationships:
              arguments:
                to: ref('silver_accounts')
                field: account_id

      - name: card_number
        data_tests: 
          - not_null:
              description: Ensures a card has a card number.
              config:
                severity: error

          - unique:
              description: Validates that card number is unique.
              config:
                severity: error

      - name: card_type
        description: Trim whitespaces and ensures standardized formatting.
        data_tests: 
          - not_null:
              description: Guarantees that card type is captured.
              config:
                severity: error

          - accepted_values:
              arguments:
                values: ['Debit', 'Credit']

      - name: card_status
        description: Trim whitespaces and ensures standardized formatting.
        data_tests:
          - not_null:
              description: Ensures that card status are provided.
              config:
                severity: error

          - accepted_values:
              arguments:
                values: ['Inactive', 'Active']
              description: Validates approved business values.
                

      - name: issued_at
        data_tests:
          - not_null:
              description: Confirms that date and time each card are issued are recorded.
              config:
                severity: error

      - name: expires_at
        data_tests:
          - not_null:
              description: Validates that expiry date of a card is recorded.
              config:
                severity: error


  - name: silver_card_transactions
    description: Contains cleansed and standardized card transaction records derived from the bronze layer.

    columns:
      - name: card_transaction_id
        description: One row per card transaction.
        data_tests:
          - not_null:
              description: Validates that card transaction id is not null.
              config:
                severity: error

          - unique:
              description:  Ensures that each card transaction row has a unique identifier.
              config:
                severity: error

      - name: card_id
        data_tests:
          - not_null:
              description: Ensures that card transactions initaited with cards is not null.
              config:
                severity: error

          - relationships:
              arguments:
                to: ref('silver_cards')
                field: card_id

      - name: transaction_id
        data_tests:
          - not_null:
              description: Ensures no null row(s).
              config:
                severity: error
          
          - unique:
              description: Validates that transactions are unique.
              config:
                severity: error

          - relationships:
              arguments:
                to: ref('silver_transactions')
                field: transaction_id

      - name: merchant_name
        data_tests: 
          - not_null:
              description: Prevents empty row(s).
              config:
                severity: error

      - name: merchant_category
        description: Trim whitespaces and ensures standardized formatting.
        data_tests:
          - not_null:
              description: Prevents empty row(s).
              config: 
                severity: warn

      - name: transaction_at
        data_tests:
          - not_null:
              description: Confirms that card transaction event are recorded.
              config:
                severity: error

      - name: created_at
        data_tests:
          - not_null:
              description: Confirms that card transaction event are recorded in the operational system.
              config:
                severity: error

          
