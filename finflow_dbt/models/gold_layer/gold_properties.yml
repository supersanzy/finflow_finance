      - name: customer_id
        description: Each customer that has a beneficiary.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: beneficiary_name
        description: >
          Each beneficiary full name inherited from the silver layer after data cleansing and text standardization.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: bank_name
        description: >
          Each beneficiary bank name inherited from the silver layer.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: status
        description: >
          Each beneficiary account status inherited from the silver layer after data cleansing and text standardization.

      - name: created_at
        description: placeholder


