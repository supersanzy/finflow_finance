models:
  - name: dim_customers
    description: >
      Customer dimension containing one record per customer for analytical reporting. 
      The model assigns a stable surrogate key while preserving the original business key for traceability and downstream joins.

    columns: 
      - name: customer_key
        description: >
         Stable surrogate key generated from customer_id using dbt_utils.generate_surrogate_key.
        data_tests:
          - not_null:
              description: >
                Ensures every customer record is assigned a surrogate key for reliable joins with downstream fact tables.
              config:
                severity: error
          - unique:
              description: >
                Confirms that each surrogate key uniquely identifies a single customer record within the dimension.
              config:
                severity: error

      - name: customer_id
        description: >
          Original business identifier for the customer retained for traceability and source system reconciliation.
        
      - name: first_name
        description: >
          Customer's first name inherited from the silver layer after data cleansing and text standardization.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: last_name
        description: >
          Customer's last name inherited from the silver layer after data cleansing and text standardization.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: email
        description: Customer's email inherited from the silver layer after data cleansing and text standardization.
        data_tests:
          - unique:
              config:
                severity: error

          - not_null:
              config:
                severity: error

      - name: phone_number
        description: Phone number of each customer inherited from the silver layer.
        data_tests:
          - unique:
              config:
                severity: error

          - not_null:
              config:
                severity: error
        

      - name: date_of_birth
        description: Date of birth of each customer.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: gender
        description: >
          Standardized gender value describing the customer for demographic analysis.
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: country
        description: >
          Country where the customer resides, used for geographic reporting and segmentation.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: state
        description: >
          State name associated with the customer's residence.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: city
        description: >
          City where the customer resides after text normalization in the silver layer.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: address
        description: >
          Customer's address inherited from the silver layer after data cleansing and text standardization.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: customer_status
        description: >
          Customer's customer_status inherited from the silver layer after data cleansing and text standardization.

      - name: created_at
        description: "{{ doc('created_at')}}"

      - name: updated_at
        description: "{{ doc('updated_at')}}"


  - name: dim_accounts
    description: Dimension for account model.

    columns:
      - name: account_id
        description: One row per account. Inherited from the silver layer.
        data_tests:
          - not_null:
              description: Ensures all rows has a unique identifier.
              config:
                severity: error
                
          - unique:
              description: Ensures that all account id are unique.
              config:
                severity: error

      - name: customer_id
        description: One account is owned by one customer ID.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: account_type
        description: Type of each account.

      - name: account_status
        description: Status of each account.

      - name: opened_at
        data_tests:
          - not_null:
              config:
                severity: error

      - name: closed_at


  
  - name: dim_beneficiaries
