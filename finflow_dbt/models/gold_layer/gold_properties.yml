  - name: fact_transactions
    description: >
      Fact table containing transactions at the the per row level. Each record represents a single transaction
      for all the different transaction type.

    columns: 
      - name: transaction_id
        description: Unique identifier for each transaction.
        data_tests:
          - not_null:
              config:
                severity: error

          - unique:
              config:
                severity: error

      - name: account_id
        description: Account ID that initiated the transaction.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: transaction_reference
        description: Transaction reference number.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: transaction_type
        description: The type of each transaction.

      - name: transaction_status
        description: The state of each transaction.

      - name: transaction_direction
        description: placeholder

      - name: amount
        description: The transaction amount
        data_tests:
          - not_null:
              config:
                severity: error


      - name: transaction_channel
        description: Shows whether the transaction is a debit or a credit.

      - name: description
        description: Transactiond description

      - name: original_transaction_id
        description: Transaction ID for reversal transaction type.

      - name: fee_for_transaction_id
        description: Transaction ID for fee transaction type.

      - name: transaction_at
        description: The date and time each transaction was initiated.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: created_at


